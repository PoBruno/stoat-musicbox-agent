name: musicbox-agent

services:
  agente:
    build: .
    image: musicbox-agent:local
    restart: unless-stopped

    # Rede do anfitrião, e isto merece explicação porque abre mão de
    # isolamento.
    #
    # O agente precisa falar RTC com o LiveKit, e mídia não passa por proxy
    # de porta: o LiveKit anuncia nos candidatos ICE o endereço em que ele
    # acha que está. No desenvolvimento local esse endereço é `127.0.0.1`,
    # que dentro de um contêiner aponta para o próprio contêiner — a
    # sinalização conecta e a mídia morre com "connection refused", o que
    # parece erro de credencial e não é.
    #
    # Pela mesma razão o `ws://localhost:8880` que o servidor anuncia só
    # significa a coisa certa se `localhost` for o anfitrião.
    #
    # Em produção o agente roda numa máquina de casa contra um LiveKit com
    # endereço público, onde rede em ponte funcionaria. Usar a mesma
    # configuração nos dois evita que só se descubra a diferença na hora de
    # implantar.
    network_mode: host

    environment:
      # Sem publicação de porta em rede de anfitrião: quem limita o alcance é
      # este endereço. `127.0.0.1` mantém a API acessível só da própria
      # máquina, que era o efeito do mapeamento anterior.
      ENDERECO: 127.0.0.1
      PORTA: ${PORTA:-7700}
      STOAT_URL: ${STOAT_URL:-}
      AGENTE_SEGREDO: ${AGENTE_SEGREDO:-}
      BATIMENTO_MS: ${BATIMENTO_MS:-15000}
      ATUALIZAR_YTDLP: ${ATUALIZAR_YTDLP:-1}

    # Extração é rajada curta, não trabalho contínuo. O teto existe para que
    # uma faixa problemática não coma o container do Proxmox inteiro.
    deploy:
      resources:
        limits:
          memory: 512M

    # O yt-dlp e o ffmpeg escrevem em /tmp. Em memória, e pequeno: nada aqui
    # precisa sobreviver a um reinício.
    #
    # O `exec` é obrigatório e não é descuido. O binário autônomo do yt-dlp
    # extrai as próprias bibliotecas para o HOME e as mapeia como executáveis;
    # o tmpfs do compose monta com `noexec` por padrão, e aí ele falha com
    # "libz.so.1: failed to map segment", que culpa uma biblioteca em vez da
    # montagem. O container roda como usuário comum e sem elevação, então o
    # que se perde aqui é pouco.
    tmpfs:
      - /tmp:size=256m,exec

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
